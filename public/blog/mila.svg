<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Mila — Greek voice commands for Android Auto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283f"/>
      <stop offset="1" stop-color="#1f3f63"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" fill="url(#bg)"/>

  <!-- car screen -->
  <rect x="120" y="120" width="760" height="380" rx="22" fill="#0e1a2a" stroke="#33506f" stroke-width="3"/>

  <!-- mic -->
  <g transform="translate(196,214) scale(4.4)" fill="#7fd1c4">
    <path d="M12,14c1.66,0 3,-1.34 3,-3V5c0,-1.66 -1.34,-3 -3,-3S9,3.34 9,5v6c0,1.66 1.34,3 3,3zM17,11c0,2.76 -2.24,5 -5,5s-5,-2.24 -5,-5H5c0,3.53 2.61,6.43 6,6.92V21h2v-3.08c3.39,-0.49 6,-3.39 6,-6.92h-2z"/>
  </g>

  <text x="330" y="252" font-family="Helvetica,Arial,sans-serif" font-size="72" font-weight="700" fill="#f2f6fa">Μίλα</text>
  <text x="330" y="306" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#93a9c2">Σε ακούω…</text>

  <!-- the two mode buttons -->
  <rect x="330" y="352" width="228" height="72" rx="36" fill="#7fd1c4"/>
  <text x="444" y="398" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#0e1a2a">Πλοήγηση</text>

  <rect x="580" y="352" width="196" height="72" rx="36" fill="none" stroke="#5d7794" stroke-width="3"/>
  <text x="678" y="398" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#c6d5e5">Κλήση</text>

  <text x="500" y="560" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#7f95ae">Greek voice commands for Android Auto</text>
</svg>
