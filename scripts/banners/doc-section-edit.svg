<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <!-- Banner for the post on letting the MCP server edit its docs: a doc with
       one section picked out, its old and new versions side by side, a check
       for the confirmed change and a history mark for the saved copy -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f4f8"/>
      <stop offset="1" stop-color="#fbfaff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2f2a45" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- the doc -->
  <g filter="url(#shadow)">
    <rect x="110" y="70" width="400" height="560" rx="20" fill="#ffffff"/>
  </g>
  <g stroke-linecap="round">
    <line x1="150" y1="125" x2="330" y2="125" stroke="#006e8f" stroke-width="14"/>
    <line x1="150" y1="165" x2="460" y2="165" stroke="#d9e2ea" stroke-width="9"/>
    <line x1="150" y1="192" x2="420" y2="192" stroke="#d9e2ea" stroke-width="9"/>
  </g>

  <!-- the section being changed -->
  <rect x="134" y="228" width="352" height="170" rx="14" fill="#f1eeff" stroke="#9d8cf2" stroke-width="3" stroke-dasharray="8 8"/>
  <g stroke-linecap="round">
    <line x1="160" y1="266" x2="300" y2="266" stroke="#006e8f" stroke-width="12"/>
    <line x1="160" y1="304" x2="455" y2="304" stroke="#c8bff5" stroke-width="9"/>
    <line x1="160" y1="331" x2="420" y2="331" stroke="#c8bff5" stroke-width="9"/>
    <line x1="160" y1="358" x2="380" y2="358" stroke="#c8bff5" stroke-width="9"/>
  </g>

  <g stroke-linecap="round">
    <line x1="150" y1="440" x2="330" y2="440" stroke="#006e8f" stroke-width="14"/>
    <line x1="150" y1="480" x2="460" y2="480" stroke="#d9e2ea" stroke-width="9"/>
    <line x1="150" y1="507" x2="440" y2="507" stroke="#d9e2ea" stroke-width="9"/>
    <line x1="150" y1="534" x2="400" y2="534" stroke="#d9e2ea" stroke-width="9"/>
    <line x1="150" y1="561" x2="430" y2="561" stroke="#d9e2ea" stroke-width="9"/>
  </g>

  <!-- path from the section to before and after -->
  <g stroke="#b9adf6" stroke-width="2.5" stroke-dasharray="6 9" fill="none" stroke-linecap="round">
    <path d="M486 290 C 560 290, 580 215, 640 215"/>
    <path d="M486 340 C 560 340, 580 455, 640 455"/>
  </g>

  <!-- before -->
  <g filter="url(#shadow)" opacity="0.8">
    <rect x="640" y="130" width="250" height="170" rx="18" fill="#ffffff"/>
  </g>
  <g stroke-linecap="round" opacity="0.8">
    <line x1="670" y1="175" x2="860" y2="175" stroke="#f3b9a6" stroke-width="9"/>
    <line x1="670" y1="205" x2="830" y2="205" stroke="#f3b9a6" stroke-width="9"/>
    <line x1="670" y1="235" x2="800" y2="235" stroke="#f3b9a6" stroke-width="9"/>
    <line x1="670" y1="265" x2="845" y2="265" stroke="#f3b9a6" stroke-width="9"/>
  </g>

  <!-- after -->
  <g filter="url(#shadow)">
    <rect x="640" y="370" width="250" height="170" rx="18" fill="#ffffff"/>
  </g>
  <g stroke-linecap="round">
    <line x1="670" y1="415" x2="860" y2="415" stroke="#a8dcc6" stroke-width="9"/>
    <line x1="670" y1="445" x2="845" y2="445" stroke="#a8dcc6" stroke-width="9"/>
    <line x1="670" y1="475" x2="790" y2="475" stroke="#a8dcc6" stroke-width="9"/>
    <line x1="670" y1="505" x2="830" y2="505" stroke="#a8dcc6" stroke-width="9"/>
  </g>

  <!-- arrow from before to after -->
  <g stroke="#9d8cf2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M765 312 L 765 356"/>
    <path d="M751 343 l14 14 l14 -14"/>
  </g>

  <!-- confirmed -->
  <g filter="url(#shadow)">
    <circle cx="990" cy="455" r="58" fill="#ffffff"/>
  </g>
  <path d="M962 456 l20 20 l36 -42" fill="none" stroke="#6bbf99" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the old text, kept -->
  <g filter="url(#shadow)">
    <circle cx="990" cy="215" r="58" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#006e8f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M958 215 a32 32 0 1 0 9 -22.6"/>
    <path d="M958 180 l9 12.4 l-14 4"/>
    <path d="M990 197 v20 l13 9"/>
  </g>
</svg>
