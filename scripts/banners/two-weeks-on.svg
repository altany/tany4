<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <!-- Banner for the post on what came of the Kent C. Dodds ideas: the parallel
       sessions on the left feed the three things that now run alongside them,
       decision notes, the code-health report and a tested restore -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#fbfaff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2f2a45" flood-opacity="0.12"/>
    </filter>
    <g id="term">
      <rect width="330" height="210" rx="18" fill="#26213d"/>
      <circle cx="26" cy="28" r="6" fill="#f5a3b5"/>
      <circle cx="46" cy="28" r="6" fill="#f7d58b"/>
      <circle cx="66" cy="28" r="6" fill="#a8dcc6"/>
    </g>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- paths from the sessions to the three things beside them -->
  <g stroke="#b9adf6" stroke-width="2.5" stroke-dasharray="6 9" fill="none" stroke-linecap="round">
    <path d="M500 360 C 600 360, 620 175, 720 175"/>
    <path d="M500 368 L 720 355"/>
    <path d="M500 376 C 600 376, 620 535, 720 535"/>
  </g>

  <!-- parallel sessions, cascaded -->
  <g filter="url(#shadow)">
    <use href="#term" x="230" y="150" opacity="0.35"/>
    <use href="#term" x="200" y="190" opacity="0.6"/>
    <use href="#term" x="170" y="230" opacity="0.85"/>
    <use href="#term" x="140" y="270"/>
  </g>
  <g>
    <rect x="166" y="320" width="130" height="9" rx="4.5" fill="#9ad9bb"/>
    <rect x="166" y="344" width="176" height="9" rx="4.5" fill="#514a78"/>
    <rect x="166" y="368" width="150" height="9" rx="4.5" fill="#514a78"/>
    <rect x="166" y="392" width="112" height="9" rx="4.5" fill="#a597ff"/>
    <rect x="166" y="420" width="12" height="15" rx="3" fill="#a597ff"/>
  </g>

  <!-- the three cards -->
  <g filter="url(#shadow)">
    <rect x="720" y="110" width="340" height="130" rx="18" fill="#ffffff" stroke="#e4def8"/>
    <rect x="720" y="290" width="340" height="130" rx="18" fill="#ffffff" stroke="#e4def8"/>
    <rect x="720" y="470" width="340" height="130" rx="18" fill="#ffffff" stroke="#e4def8"/>
  </g>

  <!-- decision notes: a page with a folded corner -->
  <g>
    <path d="M752 138 h44 l18 18 v58 a6 6 0 0 1 -6 6 h-56 a6 6 0 0 1 -6 -6 v-70 a6 6 0 0 1 6 -6 z" fill="#efecff" stroke="#a597ff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M796 138 v18 h18" fill="none" stroke="#a597ff" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="758" y="172" width="38" height="6" rx="3" fill="#a597ff"/>
    <rect x="758" y="186" width="46" height="6" rx="3" fill="#d9d2ff"/>
    <rect x="758" y="200" width="30" height="6" rx="3" fill="#d9d2ff"/>
    <rect x="842" y="152" width="170" height="10" rx="5" fill="#d9d2ff"/>
    <rect x="842" y="176" width="190" height="10" rx="5" fill="#ebe7f7"/>
    <rect x="842" y="200" width="130" height="10" rx="5" fill="#ebe7f7"/>
  </g>

  <!-- the code-health report: findings, most fixed -->
  <g>
    <circle cx="768" cy="322" r="11" fill="#e3f4ec"/>
    <path d="M762 322 l4 4 l8 -9" fill="none" stroke="#6bbf99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="792" y="317" width="150" height="10" rx="5" fill="#d9d2ff"/>
    <circle cx="768" cy="355" r="11" fill="#e3f4ec"/>
    <path d="M762 355 l4 4 l8 -9" fill="none" stroke="#6bbf99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="792" y="350" width="190" height="10" rx="5" fill="#ebe7f7"/>
    <circle cx="768" cy="388" r="11" fill="#fff0ea"/>
    <circle cx="768" cy="388" r="4.5" fill="#ff9b7a"/>
    <rect x="792" y="383" width="120" height="10" rx="5" fill="#ebe7f7"/>
  </g>

  <!-- the restore: a database and a circular arrow back to it -->
  <g>
    <ellipse cx="776" cy="512" rx="26" ry="9" fill="#efecff" stroke="#a597ff" stroke-width="2.5"/>
    <path d="M750 512 v44 a26 9 0 0 0 52 0 v-44" fill="#efecff" stroke="#a597ff" stroke-width="2.5"/>
    <path d="M750 534 a26 9 0 0 0 52 0" fill="none" stroke="#a597ff" stroke-width="2.5"/>
    <path d="M850 568 a32 32 0 1 1 22 -48" fill="none" stroke="#6bbf99" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M874 506 l-1 16 l-15 -4" fill="none" stroke="#6bbf99" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="902" y="520" width="130" height="10" rx="5" fill="#d9d2ff"/>
    <rect x="902" y="544" width="94" height="10" rx="5" fill="#ebe7f7"/>
  </g>
</svg>
