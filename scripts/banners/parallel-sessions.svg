<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <!-- Banner for the parallel AI sessions post: a hub in the middle, sessions around it -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1edff"/>
      <stop offset="1" stop-color="#fbfaff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2f2a45" flood-opacity="0.12"/>
    </filter>
    <g id="session">
      <rect width="190" height="118" rx="16" fill="#ffffff" stroke="#e4def8"/>
      <circle cx="22" cy="22" r="5" fill="#f5a3b5"/>
      <circle cx="38" cy="22" r="5" fill="#f7d58b"/>
      <circle cx="54" cy="22" r="5" fill="#a8dcc6"/>
      <rect x="22" y="48" width="110" height="8" rx="4" fill="#d9d2ff"/>
      <rect x="22" y="66" width="146" height="8" rx="4" fill="#ebe7f7"/>
      <rect x="22" y="84" width="84" height="8" rx="4" fill="#ebe7f7"/>
    </g>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- links from each session to the hub -->
  <g stroke="#b9adf6" stroke-width="2.5" stroke-dasharray="6 9" fill="none" stroke-linecap="round">
    <path d="M300 170 C 420 170, 460 260, 520 300"/>
    <path d="M900 170 C 780 170, 740 260, 680 300"/>
    <path d="M250 350 L 470 350"/>
    <path d="M950 350 L 730 350"/>
    <path d="M300 530 C 420 530, 460 440, 520 400"/>
    <path d="M900 530 C 780 530, 740 440, 680 400"/>
  </g>

  <!-- sessions -->
  <g filter="url(#shadow)">
    <use href="#session" x="110" y="111"/>
    <use href="#session" x="900" y="111"/>
    <use href="#session" x="60" y="291"/>
    <use href="#session" x="950" y="291"/>
    <use href="#session" x="110" y="471"/>
    <use href="#session" x="900" y="471"/>
  </g>

  <!-- the hub: a small board, one row per piece of work -->
  <g filter="url(#shadow)">
    <rect x="470" y="245" width="260" height="210" rx="20" fill="#26213d"/>
  </g>
  <circle cx="500" cy="277" r="5" fill="#9ad9bb"/>
  <rect x="514" y="272" width="90" height="10" rx="5" fill="#8f88b3"/>
  <g>
    <circle cx="502" cy="318" r="7" fill="#9ad9bb"/>
    <rect x="520" y="313" width="120" height="10" rx="5" fill="#e2ddf5"/>
    <rect x="652" y="313" width="48" height="10" rx="5" fill="#5f4fd6"/>
    <circle cx="502" cy="354" r="7" fill="#ff9b7a"/>
    <rect x="520" y="349" width="96" height="10" rx="5" fill="#e2ddf5"/>
    <rect x="652" y="349" width="48" height="10" rx="5" fill="#5f4fd6"/>
    <circle cx="502" cy="390" r="7" fill="#a597ff"/>
    <rect x="520" y="385" width="132" height="10" rx="5" fill="#e2ddf5"/>
    <rect x="664" y="385" width="36" height="10" rx="5" fill="#5f4fd6"/>
    <circle cx="502" cy="426" r="7" fill="#9ad9bb"/>
    <rect x="520" y="421" width="80" height="10" rx="5" fill="#e2ddf5"/>
    <rect x="652" y="421" width="48" height="10" rx="5" fill="#5f4fd6"/>
  </g>
</svg>
