<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <!-- Banner for the post comparing my agent setup with Kent C. Dodds's:
       practices on the left are kept, the ones on the right are left behind -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1edff"/>
      <stop offset="1" stop-color="#fbfaff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2f2a45" flood-opacity="0.12"/>
    </filter>
    <g id="card">
      <rect width="250" height="96" rx="16" fill="#ffffff" stroke="#e4def8"/>
      <rect x="24" y="34" width="150" height="8" rx="4" fill="#d9d2ff"/>
      <rect x="24" y="56" width="106" height="8" rx="4" fill="#ebe7f7"/>
    </g>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- paths from the left cards into the middle, and away from the right ones -->
  <g stroke="#b9adf6" stroke-width="2.5" stroke-dasharray="6 9" fill="none" stroke-linecap="round">
    <path d="M330 150 C 440 150, 470 260, 520 310"/>
    <path d="M330 310 L 520 340"/>
    <path d="M330 470 C 440 470, 470 410, 520 375"/>
  </g>
  <g stroke="#f3b9a6" stroke-width="2.5" stroke-dasharray="6 9" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M680 320 C 740 300, 800 240, 870 210"/>
    <path d="M680 365 C 740 390, 800 450, 870 490"/>
  </g>

  <!-- kept -->
  <g filter="url(#shadow)">
    <use href="#card" x="80" y="102"/>
    <use href="#card" x="80" y="262"/>
    <use href="#card" x="80" y="422"/>
  </g>
  <g fill="none" stroke="#6bbf99" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M296 148 l12 12 l22 -26"/>
    <path d="M296 308 l12 12 l22 -26"/>
    <path d="M296 468 l12 12 l22 -26"/>
  </g>

  <!-- left behind -->
  <g filter="url(#shadow)" opacity="0.72">
    <use href="#card" x="870" y="162"/>
    <use href="#card" x="870" y="442"/>
  </g>
  <g stroke="#e08a6b" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M1150 196 l26 26 M1176 196 l-26 26"/>
    <path d="M1150 476 l26 26 M1176 476 l-26 26"/>
  </g>

  <!-- my own setup in the middle -->
  <g filter="url(#shadow)">
    <rect x="490" y="250" width="220" height="190" rx="20" fill="#26213d"/>
    <circle cx="518" cy="282" r="6" fill="#f5a3b5"/>
    <circle cx="538" cy="282" r="6" fill="#f7d58b"/>
    <circle cx="558" cy="282" r="6" fill="#a8dcc6"/>
    <rect x="516" y="316" width="128" height="9" rx="4.5" fill="#9ad9bb"/>
    <rect x="516" y="340" width="168" height="9" rx="4.5" fill="#514a78"/>
    <rect x="516" y="364" width="146" height="9" rx="4.5" fill="#514a78"/>
    <rect x="516" y="388" width="104" height="9" rx="4.5" fill="#a597ff"/>
    <rect x="516" y="412" width="12" height="14" rx="3" fill="#a597ff"/>
  </g>
</svg>
